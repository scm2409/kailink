# mise configuration for KaiLink (see https://mise.jdx.dev/)
# Provides JDK 21 and sets the Android SDK to a user-local
# path — deliberately NO system-wide installation (project constitution, principle G6).

[tools]
java = "21.0.2"

[env]
# Local Android SDK (provided per-user, here: the existing SDK instance).
# The path is selected by Gradle via local.properties; the environment
# variable serves tools without local.properties support.
ANDROID_HOME = "/home/dev/android-sdk"
ANDROID_SDK_ROOT = "/home/dev/android-sdk"

[settings]
# Go-like deterministic installations are not needed; we use
# mise exclusively for the JDK.
